<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomai Recorder Interface</title>
    <style>
        :root {
            --bg-dark: #040812;
            --card-bg: rgba(10, 18, 32, 0.85);
            --border-cyan: #19d3ea;
            --nomai-blue: #2ab8ee;
            --nomai-glow: #00ffff;
            --text-color: #e0f7fa;
            --text-muted: #80deea;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Particle Stars Canvas Overlay */
        #spaceCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 600px;
            width: 100%;
            z-index: 1;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(25, 211, 234, 0.3);
            padding-bottom: 12px;
            background: radial-gradient(ellipse at top, rgba(25, 211, 234, 0.15), transparent 70%);
            border-radius: 8px;
        }

        h1 {
            color: var(--border-cyan);
            font-size: 1.3rem;
            letter-spacing: 3px;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }

        .sector-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            letter-spacing: 1px;
        }

        /* Interactive Nomai Wall Canvas */
        .wall-container {
            width: 100%;
            height: 320px;
            background: radial-gradient(circle at center, rgba(12, 28, 48, 0.9) 0%, rgba(4, 8, 18, 0.95) 100%);
            border: 1px solid var(--border-cyan);
            border-radius: 12px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(0, 255, 255, 0.1);
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* Nomai Arc & Branch Paths */
        .nomai-path {
            stroke: var(--nomai-blue);
            stroke-width: 3.5;
            fill: none;
            stroke-linecap: round;
            opacity: 0.9;
            filter: drop-shadow(0px 0px 6px #00ffff);
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawPath 0.8s ease-out forwards;
        }

        @keyframes drawPath {
            to { stroke-dashoffset: 0; }
        }

        /* Node Bulbs */
        .nomai-node {
            fill: var(--bg-dark);
            stroke: var(--nomai-blue);
            stroke-width: 3;
            cursor: pointer;
            transition: all 0.4s ease;
            filter: drop-shadow(0px 0px 8px rgba(0, 255, 255, 0.5));
        }

        .nomai-node:hover {
            stroke: var(--nomai-glow);
            r: 10;
        }

        .nomai-node.active {
            fill: var(--border-cyan);
            stroke: #ffffff;
            r: 11;
            filter: drop-shadow(0px 0px 14px #00ffff);
            animation: pulseNode 1.8s infinite alternate;
        }

        .nomai-node.locked {
            opacity: 0.25;
            cursor: not-allowed;
            stroke: #406080;
        }

        @keyframes pulseNode {
            from { filter: drop-shadow(0px 0px 8px #00ffff); }
            to { filter: drop-shadow(0px 0px 18px #ffffff); }
        }

        /* Dialogue Box */
        .dialogue-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-cyan);
            border-radius: 10px;
            padding: 20px;
            min-height: 110px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(0, 255, 255, 0.05);
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
        }

        .speaker-tag {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--border-cyan);
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }

        .dialogue-text {
            font-size: 0.98rem;
            line-height: 1.5;
            margin: 0;
            color: #f0fcfd;
        }

        /* Navigation Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-cyan);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
        }

        button:hover:not(:disabled) {
            background-color: rgba(25, 211, 234, 0.25);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        button:disabled {
            opacity: 0.3;
            border-color: rgba(25, 211, 234, 0.2);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Developer/Test Sector Selector */
        .sector-nav {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px dashed rgba(25, 211, 234, 0.3);
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sector-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            flex: initial;
        }
    </style>
</head>
<body>

<canvas id="spaceCanvas"></canvas>

<div class="container">
    <header>
        <h1>Nomai Recorder Interface</h1>
        <p class="sector-title" id="sectorTitle">PROLOGUE</p>
    </header>

    <div class="wall-container">
        <svg id="wallSvg" viewBox="0 0 360 300">
            <!-- Dynamic paths & nodes rendered here -->
        </svg>
    </div>

    <div class="dialogue-card">
        <div class="speaker-tag" id="speakerTag">SYSTEM LOG</div>
        <p class="dialogue-text" id="dialogueText">Tap any glowing node to inspect recording...</p>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="navigateNode(-1)">Previous</button>
        <button id="nextBtn" onclick="navigateNode(1)">Next</button>
    </div>

    <div class="sector-nav">
        <button class="sector-btn" onclick="loadStop(0)">Prologue</button>
        <button class="sector-btn" onclick="loadStop(1)">Stop 1</button>
        <button class="sector-btn" onclick="loadStop(2)">Stop 2</button>
        <button class="sector-btn" onclick="loadStop(3)">Stop 3</button>
        <button class="sector-btn" onclick="loadStop(4)">Stop 4</button>
    </div>
</div>

<script>
// --- Ambient Star / Dust Particle Field ---
const canvas = document.getElementById('spaceCanvas');
const ctx = canvas.getContext('2d');

let particles = [];
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

for (let i = 0; i < 70; i++) {
    particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 1.8 + 0.5,
        alpha: Math.random() * 0.8 + 0.2,
        speed: Math.random() * 0.4 + 0.1
    });
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(57, 197, 187, ${p.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#00ffff";
        ctx.fill();
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

// --- Nomai Wall Data Structure ---
const stopsData = {
    0: {
        title: "VESSEL WEAVER LOG: PROLOGUE",
        nodes: [
            { id: "node1", speaker: "SYSTEM LOG", text: "Dimensional warp complete. The prior universe's solar cycle has reached its natural end.", cx: 180, cy: 50, path: "" },
            { id: "node2", speaker: "TRANSMISSION", text: "Vessel 'Weaver' successfully passed through the quantum threshold. Thermal and gravitational anomalies are stabilizing in this new system.", cx: 100, cy: 110, path: "M180,50 Q130,80 100,110" },
            { id: "node3", speaker: "LOG ENTRY", text: "Upon atmospheric entry, structural turbulence forced an automated escape pod jettison. Emergency shuttles have scattered across this unknown world's sector coordinates.", cx: 260, cy: 120, path: "M100,110 Q180,130 260,120" },
            { id: "node4", speaker: "STATUS", text: "Core life support operational. Local atmosphere: 21% oxygen, rich carbon-based flora, mild solar radiation.", cx: 90, cy: 190, path: "M260,120 Q170,160 90,190" },
            { id: "node5", speaker: "VESSEL LOG", text: "OBJECTIVE: All deployed Nomai shuttles must recalibrate warp-frequency markers, establish contact with nearby escape pods, and converge at the secondary assembly vector. Initiate traveler signal search.", cx: 220, cy: 245, path: "M90,190 Q140,230 220,245" }
        ]
    },
    1: {
        title: "SECTOR 01: LAURIER LAUNCHPAD",
        nodes: [
            { id: "node1", speaker: "POKE", text: "Clary! The escape pod thrusters misfired during transit. Atmospheric sensors here are alarming—21% gaseous oxygen and dense leaf-based flora everywhere!", cx: 180, cy: 50, path: "" },
            { id: "node2", speaker: "CLARY", text: "Is Yarrow safe? Where did his pod land?", cx: 100, cy: 110, path: "M180,50 Q130,80 100,110" },
            { id: "node3", speaker: "POKE", text: "Telemetry shows he came down a few hundred meters North of this launchpad, tucked in a quiet green pocket right off the major St-Denis transit corridor, at Rue du Carmel.", cx: 260, cy: 120, path: "M100,110 Q180,130 260,120" },
            { id: "node4", speaker: "POKE", text: "To reach him, cross West to the St-Denis bike pathway, ride North, and enter Parc Carmel. Hurry, before he tries recalibrating the thrusters himself!", cx: 90, cy: 190, path: "M260,120 Q170,160 90,190" },
            { id: "node5", speaker: "CLARY", text: "Right. Because Yarrow's manual recalibrations always end so peacefully. On my way.", cx: 220, cy: 245, path: "M90,190 Q140,230 220,245" }
        ]
    },
    2: {
        title: "SECTOR 02: PARC CARMEL",
        nodes: [
            { id: "node1", speaker: "CASAVA", text: "Maura! Private Shuttle 03 drifted off-course. Coleus landed in a hyper-advanced sector dominated by giant glass monoliths built over old rail lines.", cx: 180, cy: 60, path: "" },
            { id: "node2", speaker: "MAURA", text: "How do we reach that research sector from Parc Carmel?", cx: 90, cy: 130, path: "M180,60 Q120,95 90,130" },
            { id: "node3", speaker: "CASAVA", text: "Ride North along the St-Denis bike line, vector West over the Rosemont elevated bridge toward Saint-Urbain, and look for the open concrete plaza at the MILA complex.", cx: 270, cy: 140, path: "M90,130 Q180,150 270,140" },
            { id: "node4", speaker: "MAURA", text: "Understood. I will retrieve him so we can prepare the final launch!", cx: 170, cy: 230, path: "M270,140 Q220,190 170,230" }
        ]
    },
    3: {
        title: "SECTOR 03: MILA PLAZA",
        nodes: [
            { id: "node1", speaker: "COLEUS", text: "Melora, bad news... I left my quantum locator at the open brick-and-wood pedestrian plaza at the entrance of Little Italy.", cx: 120, cy: 70, path: "" },
            { id: "node2", speaker: "MELORA", text: "Coleus, if I had a warp core for every critical tool you've misplaced across different dimensions, we'd have built an entire fleet by now.", cx: 240, cy: 110, path: "M120,70 Q180,85 240,110" },
            { id: "node3", speaker: "MELORA", text: "Fine. From the MILA complex, ride North along Clark or Saint-Urbain to Saint-Zotique, then head East to Plaza Shamrock at Saint-Laurent. Try not to leave yourself behind this time.", cx: 100, cy: 180, path: "M240,110 Q160,140 100,180" },
            { id: "node4", speaker: "COLEUS", text: "Duly noted! Once retrieved, we'll have all the core components needed to regroup the crew.", cx: 230, cy: 235, path: "M100,180 Q170,205 230,235" }
        ]
    },
    4: {
        title: "SECTOR 04: PLAZA SHAMROCK",
        nodes: [
            { id: "node1", speaker: "YARROW", text: "Ida! All warp core frequencies are converging on the central gathering point—the circular tree grove at Parc Dante!", cx: 180, cy: 60, path: "" },
            { id: "node2", speaker: "IDA", text: "You're right, just two blocks North-East of Plaza Shamrock! We follow Saint-Zotique East, turn onto Dante Street, and enter the park.", cx: 90, cy: 120, path: "M180,60 Q130,80 90,120" },
            { id: "node3", speaker: "YARROW", text: "Scanners confirm all shuttle signals are aligning around an active heat source in the clearing.", cx: 270, cy: 130, path: "M90,120 Q170,140 270,130" },
            { id: "node4", speaker: "IDA", text: "Outstanding! The crew is reunited. Once everyone arrives at the hearth, we ignite the engines for our next voyage!", cx: 180, cy: 230, path: "M270,130 Q220,180 180,230" }
        ]
    }
};

let currentStop = 0;
let currentNodeIndex = 0;
let unlockedNodeIndex = 0; // Step-by-step branching unlock state

function getStopFromUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    const stopParam = parseInt(urlParams.get('stop'));
    return (stopParam >= 0 && stopParam <= 4) ? stopParam : 0;
}

function loadStop(stopIndex) {
    currentStop = stopIndex;
    currentNodeIndex = 0;
    unlockedNodeIndex = 0;
    
    const stopData = stopsData[currentStop];
    document.getElementById('sectorTitle').innerText = stopData.title;

    updateUI();
}

function renderWall() {
    const svg = document.getElementById('wallSvg');
    const nodes = stopsData[currentStop].nodes;

    let svgHtml = '';

    // Render paths up to unlocked count
    for (let i = 0; i <= unlockedNodeIndex; i++) {
        if (nodes[i].path) {
            svgHtml += `<path d="${nodes[i].path}" class="nomai-path" />`;
        }
    }

    // Render nodes with status (active, unlocked, locked)
    for (let i = 0; i <= unlockedNodeIndex; i++) {
        let nodeClass = 'nomai-node';
        if (i === currentNodeIndex) {
            nodeClass += ' active';
        }

        const radius = i === currentNodeIndex ? 11 : 7.5;
        svgHtml += `<circle cx="${nodes[i].cx}" cy="${nodes[i].cy}" r="${radius}" class="${nodeClass}" onclick="selectNode(${i})" />`;
    }

    svg.innerHTML = svgHtml;
}

function updateUI() {
    const nodes = stopsData[currentStop].nodes;
    const currentNode = nodes[currentNodeIndex];

    document.getElementById('speakerTag').innerText = currentNode.speaker;
    document.getElementById('dialogueText').innerText = currentNode.text;

    document.getElementById('prevBtn').disabled = currentNodeIndex === 0;
    document.getElementById('nextBtn').disabled = currentNodeIndex === nodes.length - 1;

    renderWall();
}

function selectNode(index) {
    if (index <= unlockedNodeIndex) {
        currentNodeIndex = index;
        
        // Unlocks next sequential node/branch stem if clicking current endpoint
        if (index === unlockedNodeIndex && unlockedNodeIndex < stopsData[currentStop].nodes.length - 1) {
            unlockedNodeIndex++;
        }
        
        updateUI();
    }
}

function navigateNode(direction) {
    const nodes = stopsData[currentStop].nodes;
    const newIndex = currentNodeIndex + direction;

    if (newIndex >= 0 && newIndex < nodes.length) {
        selectNode(newIndex);
    }
}

window.onload = () => {
    const initialStop = getStopFromUrl();
    loadStop(initialStop);
};
</script>

</body>
</html>
